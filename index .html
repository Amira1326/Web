<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة | نظام محاسبي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230D1526'/%3E%3Ctext x='12' y='17' font-size='13' font-family='Arial' font-weight='bold' fill='%23C79A3D' text-anchor='middle'%3E%D8%A3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#161C2B; --ink-soft:#68707E; --ink-faint:#98A1AF;
  --sidebar:#0D1526; --sidebar-hover:#18223A; --sidebar-active:#1E4B3F; --sidebar-text:#93A0B8; --sidebar-line:rgba(255,255,255,.07);
  --accent:#1F7A63; --accent-deep:#155F4C; --accent-soft:#E4F3EE;
  --gold:#C79A3D; --gold-deep:#A87E2A; --gold-soft:#FBF1DD;
  --warn:#C0432E; --warn-soft:#FBEAE6; --good:#1F7A63; --good-soft:#E4F3EE;
  --line:#E6E8EC; --line-soft:#EEF0F3;
  --radius:10px; --radius-sm:7px; --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(16,20,30,.05);
  --shadow-sm:0 2px 8px rgba(16,20,30,.06);
  --shadow-md:0 8px 24px rgba(16,20,30,.10);
  --shadow-lg:0 20px 48px rgba(16,20,30,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;}
.icon{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- login ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(circle at 18% 22%, rgba(199,154,61,.14), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(31,122,99,.20), transparent 45%),
    linear-gradient(160deg,#0D1526 0%,#101C33 55%,#0D1526 100%);
}
.login-card{background:var(--surface);width:440px;max-width:100%;padding:40px 36px;border-radius:16px;box-shadow:var(--shadow-lg);}
.login-logo{
  width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;
  margin-bottom:18px;box-shadow:var(--shadow-sm);
}
.login-card h1{margin:0 0 6px;color:var(--ink);font-size:24px;font-weight:800;}
.login-card p{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
.mock-user{
  display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;margin-bottom:10px;
  border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);text-align:right;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.mock-user:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.mock-avatar{
  width:40px;height:40px;border-radius:11px;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Cairo',sans-serif;font-size:15px;flex-shrink:0;
}
.mock-avatar.role-admin{background:linear-gradient(135deg,#2A3F63,#16223E);}
.mock-avatar.role-accountant{background:linear-gradient(135deg,var(--accent),var(--accent-deep));}
.mock-avatar.role-sales{background:linear-gradient(135deg,var(--gold),var(--gold-deep));}
.mock-info{flex:1;}
.mock-info b{display:block;font-size:14px;}
.mock-info span{font-size:12px;color:var(--ink-soft);}
.mock-user .icon{color:var(--ink-faint);}
.login-note{font-size:12px;color:var(--ink-soft);margin-top:20px;background:var(--bg);padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-soft);}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{width:250px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;display:flex;flex-direction:column;}
.sb-brand{padding:22px 20px;border-bottom:1px solid var(--sidebar-line);display:flex;align-items:center;gap:11px;}
.sb-brand-mark{
  width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;color:var(--sidebar);font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;flex-shrink:0;
}
.sb-brand b{color:#fff;font-family:'Cairo',sans-serif;font-size:15px;display:block;line-height:1.3;}
.sb-brand span{font-size:11.5px;color:var(--sidebar-text);}
.sb-nav{flex:1;padding:16px 12px;}
.sb-section-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 8px;}
.sb-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:2px;
  border-radius:var(--radius-sm);font-size:13.5px;color:var(--sidebar-text);transition:background .15s,color .15s;
}
.sb-item .icon{color:var(--sidebar-text);transition:color .15s;}
.sb-item.clickable:hover{background:var(--sidebar-hover);color:#fff;}
.sb-item.clickable:hover .icon{color:#fff;}
.sb-item.active{background:var(--sidebar-active);color:#fff;font-weight:600;}
.sb-item.active .icon{color:var(--gold);}
.sb-item.disabled{opacity:.4;}
.sb-item span:first-of-type{flex:1;}
.sb-tag{font-size:9.5px;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:var(--radius-pill);color:var(--sidebar-text);}
.sb-user{padding:16px 18px;border-top:1px solid var(--sidebar-line);display:flex;align-items:center;gap:10px;}
.sb-user-avatar{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Cairo',sans-serif;font-size:13px;flex-shrink:0;}
.sb-user-info{flex:1;min-width:0;}
.sb-user-info b{color:#fff;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user-info span{font-size:11px;color:var(--gold);}
.sb-logout{background:none;border:none;color:var(--sidebar-text);padding:6px;border-radius:6px;flex-shrink:0;display:flex;}
.sb-logout:hover{background:var(--sidebar-hover);color:#fff;}

.main{flex:1;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 30px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-xs);position:relative;z-index:5;}
.topbar h2{margin:0;font-size:19px;color:var(--ink);font-weight:800;}
.topbar-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.topbar-date{font-size:12.5px;color:var(--ink-soft);background:var(--bg);padding:7px 14px;border-radius:var(--radius-pill);border:1px solid var(--line-soft);}
.content{padding:28px 30px 70px;max-width:1320px;}

/* ---------- kpis ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.kpi{
  background:#fff;border:1px solid var(--line-soft);padding:19px 20px;border-radius:var(--radius);
  box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .15s;
}
.kpi:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.kpi-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.kpi.warn .kpi-icon{background:var(--warn-soft);color:var(--warn);}
.kpi.gold .kpi-icon{background:var(--gold-soft);color:var(--gold-deep);}
.kpi span.kpi-label,.kpi > span{display:block;font-size:12px;color:var(--ink-soft);}
.kpi b{font-family:'Cairo',sans-serif;font-size:23px;color:var(--ink);font-weight:800;}

.panel-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px;margin-bottom:22px;box-shadow:var(--shadow-xs);}
.panel-card h3{margin:0 0 16px;font-size:15.5px;color:var(--ink);font-weight:700;}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg);padding:5px;border-radius:var(--radius-sm);width:fit-content;}
.tabs button{padding:8px 18px;border:none;background:transparent;font-size:13px;font-weight:600;border-radius:6px;color:var(--ink-soft);transition:background .15s,color .15s;}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-xs);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.btn{padding:10px 18px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,box-shadow .15s;}
.btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow-xs);}
.btn-primary:hover{background:var(--accent-deep);box-shadow:var(--shadow-sm);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-small{padding:6px 12px;font-size:12px;border-radius:6px;border:1px solid var(--line);background:#fff;margin-inline-end:4px;display:inline-flex;align-items:center;gap:5px;transition:background .15s,border-color .15s;}
.btn-small:hover{background:var(--bg);border-color:var(--ink-faint);}
.btn-small.danger{color:var(--warn);border-color:#F0CFC7;}
.btn-small.danger:hover{background:var(--warn-soft);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:right;padding:11px 12px;background:var(--bg);color:var(--ink-soft);font-weight:600;font-size:12px;}
thead tr th:first-child{border-radius:8px 0 0 8px;}
thead tr th:last-child{border-radius:0 8px 8px 0;}
tbody td{padding:12px;border-bottom:1px solid var(--line-soft);}
tbody tr:hover td{background:var(--bg);}
tbody tr:last-child td{border-bottom:none;}
.badge{padding:4px 11px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;display:inline-block;}
.badge.paid{background:var(--good-soft);color:var(--good);}
.badge.unpaid{background:var(--warn-soft);color:var(--warn);}
.badge.partial{background:var(--gold-soft);color:var(--gold-deep);}
.badge.draft{background:var(--line-soft);color:var(--ink-soft);}
.role-badge{padding:2px 9px;border-radius:var(--radius-pill);font-size:10px;background:rgba(255,255,255,.1);color:var(--gold);}

.empty-note{color:var(--ink-faint);font-size:13.5px;text-align:center;padding:44px 0;}
.coming-soon{background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:70px 20px;text-align:center;color:var(--ink-soft);box-shadow:var(--shadow-xs);}
.coming-soon .icon{width:34px;height:34px;color:var(--ink-faint);margin-bottom:10px;}
.coming-soon h3{color:var(--ink);margin-bottom:6px;font-weight:700;}

/* ---------- modal/overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,17,26,.6);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;}
.overlay.open{display:flex;}
.modal{background:#fff;width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;border-radius:16px;box-shadow:var(--shadow-lg);}
.modal.wide{width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:19px 24px;border-bottom:1px solid var(--line-soft);}
.modal-head h3{margin:0;font-size:16.5px;color:var(--ink);font-weight:700;}
.close-btn{background:var(--bg);border:none;font-size:16px;color:var(--ink-soft);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.close-btn:hover{background:var(--line);color:var(--ink);}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line-soft);display:flex;gap:10px;}

label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--ink);}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}

.line-item-row{display:grid;grid-template-columns:2fr 1fr 90px 100px 32px;gap:8px;align-items:center;margin-bottom:8px;}
.line-item-row input{padding:8px 10px;font-size:13px;}
.line-total{font-size:13px;font-weight:700;text-align:left;}
.rm-line{background:var(--warn-soft);border:none;color:var(--warn);font-size:15px;width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.line-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px;}
.line-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.line-card-top span{font-size:12px;font-weight:700;color:var(--ink-soft);}
.line-card select{margin-bottom:10px;}
.line-card-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.line-card-fields label{font-size:11px;margin:0 0 4px;}
.line-card .qty-stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;}
.line-card .qty-stepper button{width:38px;background:var(--bg);border:none;font-size:18px;font-weight:700;color:var(--ink);flex-shrink:0;}
.line-card .qty-stepper button:active{background:var(--line);}
.line-card .qty-stepper input{border:none;text-align:center;padding:8px 4px;width:100%;-moz-appearance:textfield;}
.line-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.line-card-total{font-weight:800;font-family:'Cairo',sans-serif;color:var(--ink);}
.add-line-btn{background:var(--bg);border:1px dashed var(--line);color:var(--ink-soft);padding:10px;border-radius:var(--radius-sm);width:100%;font-size:13px;margin-top:4px;font-weight:600;}
.add-line-btn:hover{border-color:var(--accent);color:var(--accent);}
.totals-box{margin-top:16px;background:var(--bg);padding:15px 17px;border-radius:var(--radius-sm);}
.trow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--ink-soft);}
.trow.total{font-size:17px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}

/* invoice view */
.inv-doc{padding:4px;}
.inv-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--sidebar);padding-bottom:14px;margin-bottom:14px;}
.inv-parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.inv-parties .box{background:var(--bg);padding:13px 15px;border-radius:var(--radius-sm);font-size:13px;}
.inv-parties h4{margin:0 0 6px;font-size:12px;color:var(--ink-soft);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sidebar);color:#fff;padding:13px 24px;border-radius:var(--radius-pill);font-size:13.5px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;}
.toast.error{background:var(--warn);}
.toast.warn{background:var(--gold-deep);}
.toast .icon{color:inherit;}
.banner{background:var(--gold-soft);border:1px solid #EFDCA8;color:#7A5A12;font-size:13px;padding:11px 16px;border-radius:var(--radius-sm);margin-bottom:16px;display:flex;align-items:center;gap:9px;}
.banner .icon{color:#A87E2A;flex-shrink:0;}

/* inventory cards */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
.inv-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs);transition:box-shadow .15s,transform .15s;}
.inv-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.inv-card-img{aspect-ratio:1/1;background:var(--bg);position:relative;overflow:hidden;}
.inv-card-img img{width:100%;height:100%;object-fit:cover;display:block;}
.inv-card-sku{position:absolute;top:8px;right:8px;background:rgba(13,17,26,.65);color:#fff;font-size:10px;padding:3px 9px;border-radius:var(--radius-pill);backdrop-filter:blur(2px);}
.inv-card-body{padding:14px 15px 15px;}
.inv-card-body h4{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;}
.inv-card-price{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:var(--accent-deep);margin-bottom:10px;}
.stock-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stock-count{font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--ink);}
.stock-count small{font-size:11px;font-weight:600;color:var(--ink-faint);}
.stock-track{background:var(--bg);border-radius:var(--radius-pill);height:6px;overflow:hidden;margin-bottom:10px;}
.stock-track-fill{height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--accent),var(--accent-deep));}
.stock-track-fill.low{background:linear-gradient(90deg,#E0855F,var(--warn));}
.service-pill{display:inline-block;font-size:11px;background:var(--gold-soft);color:var(--gold-deep);padding:3px 10px;border-radius:var(--radius-pill);margin-bottom:10px;font-weight:600;}
.inv-card-actions{display:flex;gap:6px;}
.inv-card-actions button{flex:1;padding:7px;font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;}
.inv-card-actions button:hover{background:var(--bg);}
.inv-card-actions button.danger{color:var(--warn);border-color:#F0CFC7;}
.icon-sm{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

/* search box */
.search-box{position:relative;width:260px;max-width:100%;}
.search-box .icon{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
.search-box input{padding-right:36px;}
@keyframes modalPop{from{opacity:0;transform:scale(.97) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal{animation:modalPop .16s ease-out;}
@keyframes toastPop{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
.toast.show{animation:toastPop .2s ease-out;}
.btn:active,.btn-small:active,.mock-user:active{transform:scale(.97);}
.line-item-row input.field-error{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);}
@keyframes shake{10%,90%{transform:translateX(-1px);}20%,80%{transform:translateX(2px);}30%,50%,70%{transform:translateX(-4px);}40%,60%{transform:translateX(4px);}}
.shake{animation:shake .4s ease;}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--sidebar);color:var(--sidebar-text);font-size:13px;}
.debug-banner{position:fixed;top:0;left:0;right:0;background:#B4432F;color:#fff;padding:12px 18px;font-size:13px;z-index:9999;display:none;direction:ltr;text-align:left;font-family:monospace;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow-y:auto;}
.debug-banner.show{display:block;}
.debug-banner button{position:absolute;top:8px;left:12px;background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 10px;border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer;}

/* confirm dialog */
.confirm-modal{width:380px;max-width:92vw;padding:26px 24px 22px;text-align:center;}
.confirm-icon{width:52px;height:52px;border-radius:14px;background:var(--warn-soft);color:var(--warn);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.confirm-icon .icon{width:24px;height:24px;}
.confirm-modal p{font-size:14px;color:var(--ink-soft);margin:0 0 22px;line-height:1.6;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions button{flex:1;}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding:10px 6px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-fill{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent),var(--accent-deep));border-radius:6px 6px 2px 2px;transition:height .3s;}
.bar-label{font-size:11px;color:var(--ink-soft);margin-top:8px;}
.bar-value{font-size:11px;color:var(--ink);font-weight:700;margin-bottom:4px;}
.hbar-row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
.hbar-track{background:var(--bg);border-radius:var(--radius-pill);height:14px;overflow:hidden;}
.hbar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:var(--radius-pill);}
.report-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
@media(max-width:900px){.report-grid{grid-template-columns:1fr;}}

@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .content{padding:0;}
  .overlay{position:static;background:none;display:block !important;padding:0;}
  .modal{box-shadow:none;width:100%;max-height:none;}
}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .shell{flex-direction:column;}

}

function ic(name){ return (ICONS[name]||'').replace('class="icon"','class="icon icon-sm"'); }

function searchBox(key, placeholder){
  return `<div class="search-box"><input type="text" data-search="${key}" value="${escapeHtml(state.search[key]||'')}" placeholder="${placeholder}">${ICONS.search}</div>`;

function matches(term, ...fields){
  if(!term) return true;
  const t = term.trim().toLowerCase();
  return fields.some(f=> (f||'').toString().toLowerCase().includes(t));
}

/* ============ STORAGE ============ */
async function loadAll(){
  try{ const s = await window.storage.get('erp:settings', true); state.settings = s?JSON.parse(s.value):DEFAULT_SETTINGS; }catch(e){ state.settings = DEFAULT_SETTINGS; }
  try{ const c = await window.storage.get('erp:customers', true); state.customers = c?JSON.parse(c.value):DEFAULT_CUSTOMERS; }catch(e){ state.customers = DEFAULT_CUSTOMERS; }
  try{ const i = await window.storage.get('erp:items', true); state.items = i?JSON.parse(i.value):DEFAULT_ITEMS; }catch(e){ state.items = DEFAULT_ITEMS; }
  try{ const inv = await window.storage.get('erp:invoices', true); state.invoices = inv?JSON.parse(inv.value):[]; }catch(e){ state.invoices = []; }
  try{ const sup = await window.storage.get('erp:suppliers', true); state.suppliers = sup?JSON.parse(sup.value):DEFAULT_SUPPLIERS; }catch(e){ state.suppliers = DEFAULT_SUPPLIERS; }
  try{ const pur = await window.storage.get('erp:purchases', true); state.purchases = pur?JSON.parse(pur.value):[]; }catch(e){ state.purchases = []; }
  try{ const exp = await window.storage.get('erp:expenses', true); state.expenses = exp?JSON.parse(exp.value):[]; }catch(e){ state.expenses = []; }
  try{ const u = await window.storage.get('session:currentUserId', false); const uid_ = u?JSON.parse(u.value):null; state.currentUser = uid_ ? (MOCK_USERS.find(x=>x.id===uid_)||null) : null; }catch(e){ state.currentUser = null; }
  state.loaded = true;
  render();
}

/* ============ HELPERS ============ */
function fmt(n){ return Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2,numberingSystem:'latn'}); }
function uid(p){ return p+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??""; return d.innerHTML; }
let toastTimer;
function showToast(msg, type){
  const t=document.getElementById('toast');
  t.className = 'toast show' + (type ? ' '+type : '');
  const icon = type==='error' ? ICONS.alert : (type==='warn' ? ICONS.alert : ICONS.check);
  t.innerHTML = icon + '<span>'+escapeHtml(msg)+'</span>';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

function askConfirm(message, onYes, danger){
  state.confirmDialog = {message, onYes, danger: danger!==false};
  render();
}
function resolveConfirm(yes){
  const d = state.confirmDialog;
  state.confirmDialog = null;
  if(yes && d && d.onYes) d.onYes();
  else render();
}

function resetSystem(){
  askConfirm("مسح كل بيانات النظام (منتجات، عملاء، فواتير، موردين، مشتريات، مصروفات) والبدء من جديد؟ هذا لا يمكن التراجع عنه.", async ()=>{
    try{
      await Promise.all([
        window.storage.delete('erp:settings', true).catch(()=>{}),
        window.storage.delete('erp:customers', true).catch(()=>{}),
        window.storage.delete('erp:items', true).catch(()=>{}),
        window.storage.delete('erp:invoices', true).catch(()=>{}),
        window.storage.delete('erp:suppliers', true).catch(()=>{}),
        window.storage.delete('erp:purchases', true).catch(()=>{}),
        window.storage.delete('erp:expenses', true).catch(()=>{})
      ]);
      showToast("تم مسح البيانات، جاري إعادة التحميل...");
      setTimeout(()=>location.reload(), 800);
    }catch(err){
      showToast("تعذر المسح: "+err.message, "error");
    }
  });
}

function can(action){
  const role = state.currentUser?.role;
  const perms = {
    admin:      ['createInvoice','deleteInvoice','markPaid','addCustomer','deleteCustomer','editSettings','viewReports','manageInventory','adjustStock','managePurchases','deletePurchase','markPurchasePaid','addSupplier','deleteSupplier','manageExpenses','deleteExpense'],
    accountant: ['createInvoice','markPaid','addCustomer','viewReports','manageInventory','adjustStock','managePurchases','markPurchasePaid','addSupplier','manageExpenses'],
    sales:      ['createInvoice','addCustomer']
  };
  return (perms[role]||[]).includes(action);
}

function login(userId){
  state.currentUser = MOCK_USERS.find(u=>u.id===userId);

  state.view='dashboard';
  render();
}

/* ============ CUSTOMERS ============ */
function openCustomerModal(id){
  state.customerModal = id ? {...state.customers.find(c=>c.id===id)} : {id:null,name:"",phone:"",vat:"",address:""};
  render();
}
function closeCustomerModal(){ state.customerModal=null; render(); }
function saveCustomer(e){
  e.preventDefault(); const f=e.target;
  const data = {name:f.cName.value.trim(), phone:f.cPhone.value.trim(), vat:f.cVat.value.trim(), address:f.cAddress.value.trim()};
  if(!data.name){ showToast("أدخل اسم العميل", "error"); return; }
  if(state.customerModal.id){
    const idx = state.customers.findIndex(c=>c.id===state.customerModal.id);
    state.customers[idx] = {...state.customers[idx], ...data};
  }else{
    state.customers.push({id:uid('c'), ...data});
  }
  saveCustomers(); state.customerModal=null; showToast("تم حفظ العميل"); render();
}
function deleteCustomer(id){
  askConfirm("حذف هذا العميل نهائياً؟", ()=>{
    state.customers = state.customers.filter(c=>c.id!==id);
    saveCustomers(); showToast("تم حذف العميل"); render();
  });
}

/* ============ EXPENSES ============ */
function openExpenseModal(id){
  const today = new Date().toISOString().slice(0,10);
  state.expenseModal = id ? {...state.expenses.find(x=>x.id===id), date: state.expenses.find(x=>x.id===id).date.slice(0,10)} : {id:null, date:today, category:EXPENSE_CATEGORIES[0], description:"", amount:0};
  render();
}
function closeExpenseModal(){ state.expenseModal=null; render(); }
function saveExpense(e){
  e.preventDefault(); const f=e.target;
  const data = {
    date: new Date(f.eDate.value).toISOString(),
    category: f.eCategory.value.trim() || EXPENSE_CATEGORIES[0],
    description: f.eDesc.value.trim(),
    amount: parseFloat(f.eAmount.value)||0
  };
  if(data.amount<=0){ showToast("أدخل مبلغاً صحيحاً", "error"); return; }
  if(state.expenseModal.id){
    const idx = state.expenses.findIndex(x=>x.id===state.expenseModal.id);
    state.expenses[idx] = {...state.expenses[idx], ...data};
  }else{
    state.expenses.unshift({id:uid('exp'), ...data, createdBy: state.currentUser.name});
  }
  saveExpenses(); state.expenseModal=null; showToast("تم حفظ المصروف"); render();
}
function deleteExpense(id){
  askConfirm("حذف قيد المصروف هذا نهائياً؟", ()=>{
    state.expenses = state.expenses.filter(x=>x.id!==id);
    saveExpenses(); showToast("تم حذف القيد"); render();
  });
}

/* ============ PURCHASES ============ */
function switchPurchasesTab(t){ state.purchasesTab=t; render(); }
function openNewPurchase(){
  if(state.suppliers.length===0){ showToast("أضف مورداً أولاً", "error"); return; }
  state.purchaseModal = { supplierId: state.suppliers[0].id, lines:[{id:uid('pl'), itemId:'', name:"", cost:0, qty:1}] };
  render();
}
function closePurchaseModal(){ state.purchaseModal=null; render(); }
function addPurchaseLine(){ state.purchaseModal.lines.push({id:uid('pl'),itemId:'',name:"",cost:0,qty:1}); render(); }
function removePurchaseLine(lineId){ state.purchaseModal.lines = state.purchaseModal.lines.filter(l=>l.id!==lineId); render(); }
function updatePurchaseLine(lineId, field, value){
  const line = state.purchaseModal.lines.find(l=>l.id===lineId);
  if(!line) return;
  line[field] = field==='cost'||field==='qty' ? parseFloat(value)||0 : value;
  render();
}
function pickPurchaseItem(lineId, itemId){
  const item = state.items.find(i=>i.id===itemId);
  const line = state.purchaseModal.lines.find(l=>l.id===lineId);
  if(item && line){ line.name=item.name; line.cost=item.price; line.itemId=item.id; render(); }
}
function purchaseTotal(){ return state.purchaseModal.lines.reduce((a,l)=>a+(l.cost*l.qty),0); }
function submitPurchase(e){
  e.preventDefault();
  const validLines = state.purchaseModal.lines.filter(l=>l.name.trim() && l.qty>0);
  if(validLines.length===0){

/* ============ INVOICES ============ */
function defaultDueDate(){
  const d = new Date(); d.setDate(d.getDate()+30);
  return d.toISOString().slice(0,10);
}
function openNewInvoice(){
  if(state.customers.length===0){ showToast("أضف عميلاً أولاً", "error"); return; }
  state.invoiceModal = {
    editingId: null,
    customerId: state.customers[0].id,
    lines: [{id:uid('l'), name:"", price:0, qty:1}],
    discountType:'percent', discountValue:0,
    dueDate: defaultDueDate(),
    notes:'', paidInFull:false
  };
  render();
}
function editInvoice(id){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return;
  state.invoiceModal = {
    editingId: inv.id,
    customerId: inv.customer.id || state.customers[0]?.id,
    lines: inv.lines.map(l=>({...l})),
    discountType: inv.discountType||'percent', discountValue: inv.discountValue||0,
    dueDate: inv.dueDate ? inv.dueDate.slice(0,10) : defaultDueDate(),
    notes: inv.notes||'', paidInFull: inv.status==='paid'
  };
  render();
}
function closeInvoiceModal(){ state.invoiceModal=null; render(); }
function addLine(){ state.invoiceModal.lines.push({id:uid('l'),name:"",price:0,qty:1}); render(); }
function removeLine(lineId){
  state.invoiceModal.lines = state.invoiceModal.lines.filter(l=>l.id!==lineId);
  render();
}
function updateLine(lineId, field, value){
  const line = state.invoiceModal.lines.find(l=>l.id===lineId);
  if(!line) return;
  line[field] = field==='price'||field==='qty' ? (parseFloat(value)||0) : value;
  render();
}
function stepLineQty(lineId, delta){
  const line = state.invoiceModal.lines.find(l=>l.id===lineId);
  if(!line) return;
  line.qty = Math.max(1, (parseFloat(line.qty)||0) + delta);
  render();
}
function pickItem(lineId, itemId){
  const item = state.items.find(i=>i.id===itemId);
  const line = state.invoiceModal.lines.find(l=>l.id===lineId);
  if(item && line){ line.name=item.name; line.price=item.price; line.itemId=item.id; render(); }
}
function draftSubtotal(){ return state.invoiceModal.lines.reduce((a,l)=>a+((l.price||0)*(l.qty||0)),0); }
function draftDiscount(){
  const m = state.invoiceModal;
  const sub = draftSubtotal();
  if(m.discountType==='percent') return sub * ((m.discountValue||0)/100);
  return Math.min(m.discountValue||0, sub);
}
function draftTaxableBase(){ return Math.max(0, draftSubtotal() - draftDiscount()); }
function draftTax(){ return draftTaxableBase()*(state.settings.taxRatePercent/100); }
function draftTotal(){ return draftTaxableBase()+draftTax(); }

function nextInvoiceNumber(){
  const issuedCount = state.invoices.filter(i=>i.status!=='draft').length;
  return "INV-"+(1000+issuedCount+1);
}

function submitInvoice(e){
  e.preventDefault();
  const mode = e.submitMode || 'issue';
  const m = state.invoiceModal;
  const validLines = m.lines.filter(l=>l.name.trim() && l.qty>0);
  if(validLines.length===0){
    showToast("أضف صنفاً واحداً على الأقل واملأ اسمه", "error");
    const form = document.getElementById('invoiceForm');
    if(form){
      form.classList.add('shake');
      setTimeout(()=>form.classList.remove('shake'), 400);
      const firstNameInput = form.querySelector('[data-line][data-field="name"]');
      if(firstNameInput){ firstNameInput.classList.add('field-error'); firstNameInput.focus(); }
    }
    return;
  }
  const customer = state.customers.find(c=>c.id===m.customerId);
  const total = draftTotal();

  const wasDraftBefore = m.editingId ? (state.invoices.find(i=>i.id===m.editingId)?.status==='draft') : true;
  const deductStockNow = mode==='issue' && wasDraftBefore;

  const baseFields = {
    dueDate: m.dueDate || defaultDueDate(),
    notes: (m.notes||'').trim(),
    customer, lines: validLines,
    subtotal: draftSubtotal(),
    discountType: m.discountType, discountValue: m.discountValue||0, discountAmount: draftDiscount(),
    taxRate: state.settings.taxRatePercent, taxAmount: draftTax(), total,
    createdBy: state.currentUser.name
  };

  let invoice;
  if(m.editingId){
    const idx = state.invoices.findIndex(i=>i.id===m.editingId);
    if(idx===-1){ showToast("تعذر إيجاد الفاتورة", "error"); return; }
    invoice = state.invoices[idx];
    Object.assign(invoice, baseFields);
    if(mode==='issue' && invoice.status==='draft'){
      invoice.number = nextInvoiceNumber();
      invoice.date = new Date().toISOString();
      invoice.status = m.paidInFull ? 'paid' : 'unpaid';
      invoice.amountPaid = m.paidInFull ? total : 0;
    } else if(mode==='draft'){
      invoice.status = 'draft';
    }
  }else{
    invoice = {
      id: uid('INV'),
      number: mode==='issue' ? nextInvoiceNumber() : null,
      date: new Date().toISOString(),
      ...baseFields,
      amountPaid: (mode==='issue' && m.paidInFull) ? total : 0,
      status: mode==='draft' ? 'draft' : (m.paidInFull ? 'paid' : 'unpaid')
    };
    state.invoices.unshift(invoice);
  }
  saveInvoices();

  let lowStockWarning = false;
  if(deductStockNow){
    validLines.forEach(l=>{
      if(l.itemId){
        const item = state.items.find(i=>i.id===l.itemId);
        if(item && item.trackStock){
          item.stock = item.stock - l.qty;
          if(item.stock <= item.lowStock) lowStockWarning = true;
        }
      }
    });
    saveItems();
  }

  state.invoiceModal=null;
  const msg = mode==='draft'
    ? "تم حفظ الفاتورة كمسودة، تقدر ترجع تعدلها لاحقاً"
    : (lowStockWarning ? "تم إصدار الفاتورة "+invoice.number+" — تنبيه: مخزون بعض الأصناف منخفض" : "تم إصدار الفاتورة "+invoice.number);
  showToast(msg, mode==='draft' ? undefined : (lowStockWarning ? "warn" : undefined));
  render();
}
function invoiceRemaining(inv){ return Math.max(0, Math.round((inv.total - (inv.amountPaid||0))*100)/100); }
function invoiceIsOverdue(inv){ return inv.status!=='draft' && invoiceRemaining(inv)>0 && inv.dueDate && new Date(inv.dueDate) < new Date(new Date().toDateString()); }
function invoiceStatusInfo(inv){
  if(inv.status==='draft') return {key:'draft', label:'مسودة'};
  const remaining = invoiceRemaining(inv);
  if(remaining<=0) return {key:'paid', label:'مدفوعة بالكامل'};
  if(invoiceIsOverdue(inv)) return {key:'overdue', label:'متأخرة'};
  if((inv.amountPaid||0)>0) return {key:'partial', label:'مدفوعة جزئياً'};
  return {key:'unpaid', label:'غير مدفوعة'};
}
function markFullyPaid(id){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return;
  inv.amountPaid = inv.total; inv.status='paid';
  saveInvoices(); showToast("تم تعليم الفاتورة كمدفوعة بالكامل"); render();
}
function openPaymentModal(id){
  const inv = state.invoices.find(i=>i.id===id);
  if(!inv) return;
  state.paymentModal = { invoiceId:id, amount: invoiceRemaining(inv) };
  render();
}
function closePaymentModal(){ state.paymentModal=null; render(); }
function submitPayment(e){
  e.preventDefault();
  const f = e.target;
  const amount = parseFloat(f.amount.value)||0;
  const inv = state.invoices.find(i=>i.id===state.paymentModal.invoiceId);
  if(!inv || amount<=0){ showToast("أدخل مبلغاً صحيحاً", "error"); return; }
  inv.amountPaid = Math.min(inv.total, (inv.amountPaid||0) + amount);
  inv.status = invoiceRemaining(inv)<=0 ? 'paid' : 'partial';
  saveInvoices();
  state.paymentModal=null;
  showToast("تم تسجيل دفعة "+fmt(amount)+" "+state.settings.currency);
  render();
}
function deleteInvoice(id){
  askConfirm("حذف هذه الفاتورة نهائياً؟ لا يمكن التراجع بعد الحذف.", ()=>{
    state.invoices = state.invoices.filter(i=>i.id!==id);
    saveInvoices(); showToast("تم حذف الفاتورة"); render();
  });
}

function renderReports(){
  const now = new Date();
  const inPeriod = (d)=>{
    const dt = new Date(d);
    if(state.reportsPeriod==='all') return true;
    return dt.getMonth()===now.getMonth() && dt.getFullYear()===now.getFullYear();
  };
  const invF = state.invoices.filter(i=>inPeriod(i.date));
  const purF = state.purchases.filter(p=>inPeriod(p.date));
  const expF = state.expenses.filter(x=>inPeriod(x.date));

  const salesSubtotal = invF.reduce((a,i)=>a+i.subtotal,0);
  const salesTax = invF.reduce((a,i)=>a+i.taxAmount,0);
  const purchasesTotal = purF.reduce((a,p)=>a+p.total,0);
  const expensesTotal = expF.reduce((a,x)=>a+x.amount,0);
  const netProfit = salesSubtotal - purchasesTotal - expensesTotal;
  const receivables = state.invoices.filter(i=>i.status!=='draft').reduce((a,i)=>a+invoiceRemaining(i),0);
  const payables = state.purchases.filter(p=>p.status==='unpaid').reduce((a,p)=>a+p.total,0);

  // last 6 months sales bar chart
  const months = [];
  for(let k=5;k>=0;k--){
    const d = new Date(now.getFullYear(), now.getMonth()-k, 1);
    months.push({key:d.getFullYear()+'-'+d.getMonth(), label:d.toLocaleDateString('ar-SA',{month:'short', numberingSystem:'latn'})});
  }
  const monthTotals = months.map(m=>{
    const total = state.invoices.filter(i=>{ const d=new Date(i.date); return (d.getFullYear()+'-'+d.getMonth())===m.key; }).reduce((a,i)=>a+i.total,0);
    return {...m, total};
  });
  const maxMonth = Math.max(1, ...monthTotals.map(m=>m.total));

  // expense breakdown by category
  const catTotals = {};
  expF.forEach(x=>{ catTotals[x.category] = (catTotals[x.category]||0) + x.amount; });
  const catList = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const maxCat = Math.max(1, ...catList.map(c=>c[1]));

  // top customers
  const custTotals = {};
  invF.forEach(i=>{ custTotals[i.customer.name] = (custTotals[i.customer.name]||0) + i.total; });
  const topCustomers = Object.entries(custTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `
  <div class="tabs">
    <button class="${state.reportsPeriod==='month'?'active':''}" data-action="reports-period" data-period="month">هذا الشهر</button>
    <button class="${state.reportsPeriod==='all'?'active':''}" data-action="reports-period" data-period="all">كل الفترات</button>
  </div>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-icon">${ICONS.money}</div><span class="kpi-label">مبيعات (بدون ضريبة)</span><b>${fmt(salesSubtotal)} ${escapeHtml(state.settings.currency)}</b></div>
    <div class="kpi"><div class="kpi-icon">${ICONS.fileText}</div><span class="kpi-label">ضريبة المبيعات المحصّلة</span><b>${fmt(salesTax)} ${escapeHtml(state.settings.currency)}</b></div>
    <div class="kpi warn"><div class="kpi-icon">${ICONS.purchases}</div><span class="kpi-label">المشتريات + المصروفات</span><b>${fmt(purchasesTotal+expensesTotal)} ${escapeHtml(state.settings.currency)}</b></div>
    <div class="kpi ${netProfit>=0?'':'warn'}"><div class="kpi-icon">${ICONS.reports}</div><span class="kpi-label">صافي الربح التقديري</span><b>${fmt(netProfit)} ${escapeHtml(state.settings.currency)}</b></div>
  </div>

  <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:24px;">
    <div class="kpi warn"><div class="kpi-icon">${ICONS.alert}</div><span class="kpi-label">ذمم مدينة (فواتير غير مدفوعة)</span><b>${fmt(receivables)} ${escapeHtml(state.settings.currency)}</b></div>
    <div class="kpi gold"><div class="kpi-icon">${ICONS.money}</div><span class="kpi-label">ذمم دائنة (مستحق للموردين)</span><b>${fmt(payables)} ${escapeHtml(state.settings.currency)}</b></div>
  </div>

  <div class="report-grid">
    <div class="panel-card">
      <h3>المبيعات آخر 6 أشهر</h3>
      <div class="bar-chart">
        ${monthTotals.map(m=>`
          <div class="bar-col">
            <div class="bar-value">${m.total>0?fmt(m.total):''}</div>
            <div class="bar-fill" style="height:${Math.max(4,(m.total/maxMonth)*140)}px;"></div>
            <div class="bar-label">${m.label}</div>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="panel-card">
      <h3>أعلى العملاء (${state.reportsPeriod==='month'?'هذا الشهر':'كل الفترات'})</h3>
      ${topCustomers.length===0 ? `<div class="empty-note">لا توجد بيانات كافية</div>` :
        topCustomers.map(([name,total])=>`
          <div class="hbar-row">
            <span>${escapeHtml(name)}</span>
            <div class="hbar-track"><div class="hbar-fill" style="width:${(total/topCustomers[0][1])*100}%;"></div></div>
            <span style="text-align:left;">${fmt(total)}</span>
          </div>
        `).join('')
      }
    </div>
  </div>

  <div class="panel-card" style="margin-top:20px;">
    <h3>المصروفات حسب الفئة (${state.reportsPeriod==='month'?'هذا الشهر':'كل الفترات'})</h3>
    ${catList.length===0 ? `<div class="empty-note">لا توجد مصروفات مسجّلة لهذه الفترة</div>` :
      catList.map(([cat,total])=>`
        <div class="hbar-row">
          <span>${escapeHtml(cat)}</span>
          <div class="hbar-track"><div class="hbar-fill" style="background:var(--warn);width:${(total/maxCat)*100}%;"></div></div>
          <span style="text-align:left;">${fmt(total)}</span>
        </div>
      `).join('')
    }
  </div>
  `;
}

function invoiceQrData(inv){
  const lines = [
    escapeHtml(state.settings.companyName),
    'VAT: '+escapeHtml(state.settings.vatNumber),

    'VAT Amt: '+fmt(inv.taxAmount)+' '+state.settings.currency,
    'Invoice#: '+inv.number
  ].join(' | ');
  return encodeURIComponent(lines);
}

            <div class="totals-box" style="width:280px;flex-shrink:0;">
              <div class="trow"><span>المجموع الفرعي</span><span>${fmt(inv.subtotal)} ${escapeHtml(state.settings.currency)}</span></div>
              ${inv.discountAmount>0 ? `<div class="trow"><span>الخصم${inv.discountType==='percent'?' ('+inv.discountValue+'%)':''}</span><span>- ${fmt(inv.discountAmount)} ${escapeHtml(state.settings.currency)}</span></div>` : ''}
              <div class="trow"><span>الضريبة (${inv.taxRate}%)</span><span>${fmt(inv.taxAmount)} ${escapeHtml(state.settings.currency)}</span></div>
              <div class="trow total"><span>الإجمالي</span><span>${fmt(inv.total)} ${escapeHtml(state.settings.currency)}</span></div>
              ${(inv.amountPaid||0)>0 ? `<div class="trow" style="color:var(--good);"><span>مدفوع</span><span>${fmt(inv.amountPaid)} ${escapeHtml(state.settings.currency)}</span></div>` : ''}
              ${remaining>0 ? `<div class="trow" style="color:var(--warn);font-weight:700;"><span>المتبقي</span><span>${fmt(remaining)} ${escapeHtml(state.settings.currency)}</span></div>` : ''}
            </div>
          </div>
          <div class="inv-foot-note" style="margin-top:18px;font-size:11px;color:var(--ink-faint);border-top:1px dashed var(--line);padding-top:10px;">هذه الفاتورة ورمز الاستجابة السريعة صادرة من نظام تجريبي لأغراض العرض، وقد لا تستوفي جميع متطلبات الفوترة الإلكترونية الرسمية المعتمدة من هيئة الزكاة والضريبة والجمارك.</div>
        </div>
      </div>
      <div class="modal-foot no-print">
        ${st.key==='draft' ? `<button class="btn btn-primary" data-action="edit-invoice" data-id="${inv.id}">${ic('edit')}متابعة التعديل والإصدار</button>` : `<button class="btn btn-primary" data-action="print-invoice-doc">${ICONS.print}طباعة / حفظ PDF</button>`}
        ${(can('markPaid') && st.key!=='draft' && remaining>0) ? `<button class="btn btn-outline" data-action="open-payment" data-id="${inv.id}">${ic('money')}تسجيل دفعة</button>` : ''}
        <button class="btn btn-outline" data-action="close-invoice-view">إغلاق</button>
      </div>
    </div>
  </div>`;
}

/* ============ EVENTS ============ */
function safe(fn){
  return function(...args){
    try{ return fn.apply(this, args); }
    catch(err){
      console.error(err);
      showToast("حدث خطأ غير متوقع: "+(err && err.message ? err.message : err), "error");
      showDebugError('Handler error: '+(err && err.stack ? err.stack : err));
    }
  };
}

function attachHandlers(){
  document.querySelectorAll('[data-search]').forEach(el=>{
    el.oninput = ()=>{
      const key = el.getAttribute('data-search');
      const pos = (el.type==='text') ? el.selectionStart : null;
      state.search[key] = el.value;
      render();
      const ne = document.querySelector('[data-search="'+key+'"]');
      if(ne){ ne.focus(); if(pos!==null){ try{ ne.setSelectionRange(pos,pos); }catch(e){} } }
    };
  });
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = safe((e)=>{
      const a = el.getAttribute('data-action'); const id = el.getAttribute('data-id');
      switch(a){
        case 'login': login(id); break;
        case 'logout': logout(); break;
        case 'goto': goto(el.getAttribute('data-view')); break;
        case 'sales-tab': switchSalesTab(el.getAttribute('data-tab')); break;
        case 'new-invoice': openNewInvoice(); break;
        case 'close-invoice-modal': closeInvoiceModal(); break;
        case 'close-invoice-modal-overlay': if(e.target===el) closeInvoiceModal(); break;
        case 'add-line': addLine(); break;
        case 'remove-line': removeLine(id); break;
        case 'new-customer': openCustomerModal(); break;
        case 'edit-customer': openCustomerModal(id); break;
        case 'delete-customer': deleteCustomer(id); break;
        case 'close-customer-modal': closeCustomerModal(); break;
        case 'close-customer-overlay': if(e.target===el) closeCustomerModal(); break;
        case 'view-invoice': e.preventDefault(); viewInvoice(id); break;
        case 'edit-invoice': state.viewingInvoice=null; editInvoice(id); break;
        case 'delete-invoice': deleteInvoice(id); break;
        case 'close-invoice-view': closeInvoiceView(); break;
        case 'close-invoice-view-overlay': if(e.target===el) closeInvoiceView(); break;
        case 'print-invoice-doc': printInvoiceDoc(); break;
        case 'new-product': openProductModal(); break;
        case 'edit-product': openProductModal(id); break;
        case 'delete-product': deleteProduct(id); break;
        case 'close-product-modal': closeProductModal(); break;
        case 'close-product-overlay': if(e.target===el) closeProductModal(); break;
        case 'adjust-stock': openStockAdjust(id); break;
        case 'close-stock-modal': closeStockAdjust(); break;
        case 'close-stock-overlay': if(e.target===el) closeStockAdjust(); break;
        case 'purchases-tab': switchPurchasesTab(el.getAttribute('data-tab')); break;
        case 'new-supplier': openSupplierModal(); break;
        case 'edit-supplier': openSupplierModal(id); break;
        case 'delete-supplier': deleteSupplier(id); break;
        case 'close-supplier-modal': closeSupplierModal(); break;
        case 'close-supplier-overlay': if(e.target===el) closeSupplierModal(); break;
        case 'new-purchase': openNewPurchase(); break;
        case 'close-purchase-modal': closePurchaseModal(); break;
        case 'close-purchase-overlay': if(e.target===el) closePurchaseModal(); break;
        case 'add-purchase-line': addPurchaseLine(); break;
        case 'remove-purchase-line': removePurchaseLine(id); break;
        case 'view-purchase': viewPurchase(id); break;
        case 'toggle-purchase-status': togglePurchaseStatus(id); break;
        case 'delete-purchase': deletePurchase(id); break;
        case 'close-purchase-view': closePurchaseView(); break;
        case 'close-purchase-view-overlay': if(e.target===el) closePurchaseView(); break;
        case 'new-expense': openExpenseModal(); break;
        case 'edit-expense': openExpenseModal(id); break;
        case 'delete-expense': deleteExpense(id); break;
        case 'close-expense-modal': closeExpenseModal(); break;
        case 'close-expense-overlay': if(e.target===el) closeExpenseModal(); break;
        case 'reports-period': state.reportsPeriod = el.getAttribute('data-period'); render(); break;
        case 'confirm-yes': resolveConfirm(true); break;
        case 'confirm-no': resolveConfirm(false); break;
        case 'open-payment': openPaymentModal(id); break;
        case 'close-payment-modal': closePaymentModal(); break;
        case 'close-payment-overlay': if(e.target===el) closePaymentModal(); break;
        case 'reset-system': resetSystem(); break;
        case 'trigger-submit': {
          const formId = el.getAttribute('data-form');
          const submitMode = el.getAttribute('data-mode');
          const form = document.getElementById(formId);
          if(form && typeof form.onsubmit === 'function'){
            form.onsubmit({preventDefault:()=>{}, target: form, submitMode});
          } else {
            showDebugError('trigger-submit: form not found or has no handler ('+formId+')');
          }
          break;
        }
        case 'line-qty-plus': stepLineQty(id, 1); break;
        case 'line-qty-minus': stepLineQty(id, -1); break;
      }
    });
  });

  document.querySelectorAll('[data-purline]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'onchange' : 'oninput';
    el[evt] = ()=>{
      const lineId = el.getAttribute('data-purline'); const field = el.getAttribute('data-field');
      if(field==='pickitem'){ if(el.value) pickPurchaseItem(lineId, el.value); return; }
      const pos = (el.type==='text') ? el.selectionStart : null;
      updatePurchaseLine(lineId, field, el.value);
      const ne = document.querySelector('[data-purline="'+lineId+'"][data-field="'+field+'"]');
      if(ne){ ne.focus(); if(pos!==null){ try{ ne.setSelectionRange(pos,pos); }catch(err){} } }
    };
  });

  const purSel = document.getElementById('purSupplier');
  if(purSel) purSel.onchange = ()=>{ state.purchaseModal.supplierId = purSel.value; };

  document.querySelectorAll('[data-line]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'onchange' : 'oninput';
    el[evt] = ()=>{
      const lineId = el.getAttribute('data-line'); const field = el.getAttribute('data-field');
      if(field==='pickitem'){ if(el.value) pickItem(lineId, el.value); return; }
      const pos = (el.type==='text') ? el.selectionStart : null;
      updateLine(lineId, field, el.value);
      const ne = document.querySelector('[data-line="'+lineId+'"][data-field="'+field+'"]');
      if(ne){ ne.focus(); if(pos!==null){ try{ ne.setSelectionRange(pos,pos); }catch(err){} } }
    };
  });

  const custSel = document.getElementById('invCustomer');
  if(custSel) custSel.onchange = ()=>{ state.invoiceModal.customerId = custSel.value; };
  const discType = document.getElementById('invDiscountType');
  if(discType) discType.onchange = ()=>{ state.invoiceModal.discountType = discType.value; render(); };
  const discVal = document.getElementById('invDiscountValue');
  if(discVal) discVal.oninput = ()=>{
    const pos = (discVal.type==='text') ? discVal.selectionStart : null;
    state.invoiceModal.discountValue = parseFloat(discVal.value)||0;
    render();
    const ne = document.getElementById('invDiscountValue');
    if(ne){ ne.focus(); if(pos!==null){ try{ ne.setSelectionRange(pos,pos); }catch(e){} } }
  };
  const dueDateEl = document.getElementById('invDueDate');
  if(dueDateEl) dueDateEl.onchange = ()=>{ state.invoiceModal.dueDate = dueDateEl.value; };
  const notesEl = document.getElementById('invNotes');
  if(notesEl) notesEl.oninput = ()=>{ state.invoiceModal.notes = notesEl.value; };
  const paidFullEl = document.getElementById('invPaidFull');
  if(paidFullEl) paidFullEl.onchange = ()=>{ state.invoiceModal.paidInFull = paidFullEl.checked; };

  const cf = document.getElementById('customerForm'); if(cf) cf.onsubmit = safe(saveCustomer);
  const invf = document.getElementById('invoiceForm'); if(invf) invf.onsubmit = safe(submitInvoice);
  const pf = document.getElementById('productForm'); if(pf) pf.onsubmit = safe(saveProduct);
  const stf = document.getElementById('stockForm'); if(stf) stf.onsubmit = safe(submitStockAdjust);
  const supf = document.getElementById('supplierForm'); if(supf) supf.onsubmit = safe(saveSupplier);
  const purf = document.getElementById('purchaseForm'); if(purf) purf.onsubmit = safe(submitPurchase);
  const expf = document.getElementById('expenseForm'); if(expf) expf.onsubmit = safe(saveExpense);
  const payf = document.getElementById('paymentForm'); if(payf) payf.onsubmit = safe(submitPayment);
  const pImgInput = document.querySelector('input[name="pImg"]');
  const pImgPreview = document.getElementById('pImgPreview');
  if(pImgInput && pImgPreview) pImgInput.oninput = ()=>{ pImgPreview.src = pImgInput.value; };
  const sf = document.getElementById('settingsForm');
  if(sf) sf.onsubmit = safe((e)=>{
    e.preventDefault(); const f=e.target;
    state.settings = {...state.settings,
      companyName: f.companyName.value.trim()||state.settings.companyName,
      currency: f.currency.value.trim()||state.settings.currency,
      crNumber: f.crNumber.value.trim(), vatNumber: f.vatNumber.value.trim(),
      address: f.address.value.trim(), taxRatePercent: parseFloat(f.taxRatePercent.value)||0
    };
    saveSettings(); showToast("تم حفظ الإعدادات"); render();
  });
}

function showDebugError(text){
  const banner = document.getElementById('debugBanner');
  const content = document.getElementById('debugBannerContent');
  if(!banner || !content) return;
  const time = new Date().toLocaleTimeString('ar-SA',{numberingSystem:'latn'});
  content.textContent = '['+time+'] '+text+'\n\n'+(content.textContent||'');
  banner.classList.add('show');
}
window.addEventListener('error', (e)=>{
  showDebugError('JS Error: '+e.message+' (line '+e.lineno+', col '+e.colno+')');
});
window.addEventListener('unhandledrejection', (e)=>{
  showDebugError('Promise rejection: '+(e.reason && e.reason.message ? e.reason.message : e.reason));
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(state.viewingInvoice) return closeInvoiceView();
  if(state.viewingPurchase) return closePurchaseView();
  if(state.invoiceModal) return closeInvoiceModal();
  if(state.purchaseModal) return closePurchaseModal();
  if(state.customerModal) return closeCustomerModal();
  if(state.supplierModal) return closeSupplierModal();
  if(state.productModal) return closeProductModal();
  if(state.stockAdjustModal) return closeStockAdjust();
  if(state.expenseModal) return closeExpenseModal();
  if(state.paymentModal) return closePaymentModal();
  if(state.confirmDialog) return resolveConfirm(false);
});

loadAll();
</script>
